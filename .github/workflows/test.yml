name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Tests run on committed extracted-text fixtures, so they need no network
      # and no poppler: a parser change is checked against the same bytes every time.
      - name: Test
        run: npm test
