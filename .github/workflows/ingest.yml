name: ingest

# Real end-to-end run against the archive: fetches PDFs, extracts with poppler,
# validates, and uploads the dataset as an artifact. It does not commit data,
# so a rebuild is always an explicit, reviewable action.

on:
  workflow_dispatch:
    inputs:
      event:
        description: 'Event id (e.g. M2405)'
        required: true
        default: 'M2405'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build dataset
        run: node src/build.js --event "${{ inputs.event }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ inputs.event }}
          path: data/events/${{ inputs.event }}.json
          if-no-files-found: error
